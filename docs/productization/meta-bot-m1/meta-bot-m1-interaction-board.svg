<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Meta Bot M1 interaction board</title>
  <desc id="desc">Twelve three-beat mouthless interaction sequences for pointer, drag, collision, panel and refresh events.</desc>
  <defs>
    <style>
      .bg{fill:#E8EEE9}.paper{fill:#F8FAF7}.card{fill:#EEF3EF;stroke:#D5DDD7;stroke-width:2}.body{fill:#02AD45}.eye{fill:#F3F6F2}.pupil{fill:#181B20}.arm{fill:none;stroke:#181B20;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.motion{fill:none;stroke:#02AD45;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 6}.arrow{fill:none;stroke:#9AA59D;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#FFFFFF;stroke:#181B20;stroke-width:3}.h1{font:760 42px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#181B20}.sub{font:400 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#5F6B63}.name{font:700 20px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#181B20}.meta{font:500 14px Consolas,'Microsoft YaHei',sans-serif;fill:#66726A}.beat{font:650 12px Consolas,monospace;fill:#7B877F}.index{font:750 14px Consolas,monospace;fill:#02AD45}
    </style>
    <g id="n"><circle r="48" class="body"/><ellipse cx="-17" cy="-6" rx="17" ry="21" class="eye"/><ellipse cx="17" cy="-6" rx="17" ry="21" class="eye"/><circle cx="-14" cy="-3" r="7" class="pupil"/><circle cx="14" cy="-3" r="7" class="pupil"/></g>
    <g id="cautious"><ellipse rx="51" ry="45" class="body"/><path d="M-37-7Q-18-23 0-8Q-4 12-20 14Q-34 10-37-7Z" class="eye"/><path d="M0-8Q18-23 37-7Q34 10 20 14Q4 12 0-8Z" class="eye"/><circle cx="-12" cy="1" r="6" class="pupil"/><circle cx="12" cy="1" r="6" class="pupil"/></g>
    <g id="look-r"><circle r="48" class="body"/><ellipse cx="-17" cy="-6" rx="17" ry="21" class="eye"/><ellipse cx="17" cy="-6" rx="17" ry="21" class="eye"/><circle cx="-7" cy="-3" r="7" class="pupil"/><circle cx="24" cy="-3" r="7" class="pupil"/></g>
    <g id="curious"><path d="M-48 3Q-43-45-3-49Q46-43 49 3Q43 47 1 49Q-43 45-48 3Z" class="body"/><ellipse cx="-17" cy="-9" rx="19" ry="22" class="eye"/><ellipse cx="18" cy="-4" rx="15" ry="19" class="eye"/><circle cx="-8" cy="-4" r="7" class="pupil"/><circle cx="25" cy="0" r="6" class="pupil"/></g>
    <g id="press"><ellipse rx="52" ry="42" cy="6" class="body"/><ellipse cx="-18" cy="1" rx="18" ry="17" class="eye"/><ellipse cx="18" cy="1" rx="18" ry="17" class="eye"/><circle cx="-12" cy="4" r="7" class="pupil"/><circle cx="22" cy="4" r="7" class="pupil"/></g>
    <g id="hold"><rect x="-48" y="-48" width="96" height="96" rx="19" class="body"/><rect x="-35" y="-20" width="33" height="35" rx="10" class="eye"/><rect x="2" y="-20" width="33" height="35" rx="10" class="eye"/><ellipse cx="-11" cy="-2" rx="5" ry="9" class="pupil"/><ellipse cx="11" cy="-2" rx="5" ry="9" class="pupil"/><path d="M-44 20q-18 4-17 23m105-23q18 4 17 23" class="arm"/></g>
    <g id="stretch"><ellipse rx="61" ry="42" class="body"/><ellipse cx="-18" cy="-5" rx="18" ry="19" class="eye"/><rect x="2" y="-24" width="39" height="39" rx="12" class="eye"/><circle cx="-10" cy="-2" r="7" class="pupil"/><circle cx="30" cy="-2" r="7" class="pupil"/><path d="M48 18q22 4 33-10m0 0-1 12m1-12-12-2" class="arm"/></g>
    <g id="lag"><ellipse rx="64" ry="39" class="body"/><ellipse cx="-20" cy="-5" rx="18" ry="18" class="eye"/><ellipse cx="17" cy="-5" rx="18" ry="18" class="eye"/><circle cx="-29" cy="-2" r="7" class="pupil"/><circle cx="8" cy="-2" r="7" class="pupil"/><path d="M-45 18q-21 6-28 24m112-24q-20 5-29 22" class="arm"/><path d="M-78-10h-18m20 15h-13" class="motion"/></g>
    <g id="turn"><path d="M-50 4Q-44-47 3-49Q48-42 49 5Q42 48-2 50Q-45 43-50 4Z" class="body"/><path d="M-36-13l32-12v34q-17 8-31 0z" class="eye"/><path d="M4-22l33 10v24q-17 7-32-1z" class="eye"/><circle cx="-11" cy="-3" r="6" class="pupil"/><circle cx="27" cy="0" r="6" class="pupil"/><path d="M-43 24q-20 7-22 27" class="arm"/></g>
    <g id="dizzy"><circle r="48" class="body"/><ellipse cx="-17" cy="-5" rx="18" ry="20" class="eye"/><ellipse cx="17" cy="-5" rx="18" ry="20" class="eye"/><circle cx="-23" cy="-4" r="6" class="pupil"/><circle cx="23" cy="-4" r="6" class="pupil"/><path d="M-28-60q28-17 56 0q-28 18-56 0Z" class="motion"/></g>
    <g id="impact-r"><path d="M-50 0Q-45-47 0-49Q42-46 48-14V15Q40 46 0 49Q-45 45-50 0Z" class="body"/><ellipse cx="-17" cy="-6" rx="18" ry="20" class="eye"/><path d="M2-24h31v38H2z" class="eye"/><circle cx="-10" cy="-3" r="7" class="pupil"/><circle cx="25" cy="-3" r="7" class="pupil"/><path d="M44 18q18 0 24-17m0 0-9 7m9-7-2 12" class="arm"/></g>
    <g id="squash"><ellipse rx="57" ry="37" cy="10" class="body"/><ellipse cx="-19" cy="4" rx="19" ry="16" class="eye"/><ellipse cx="19" cy="4" rx="19" ry="16" class="eye"/><circle cx="-16" cy="6" r="6" class="pupil"/><circle cx="16" cy="6" r="6" class="pupil"/></g>
    <g id="panel-bot"><circle r="48" class="body"/><ellipse cx="-17" cy="-6" rx="17" ry="21" class="eye"/><ellipse cx="17" cy="-6" rx="17" ry="21" class="eye"/><circle cx="-8" cy="-3" r="7" class="pupil"/><circle cx="25" cy="-3" r="7" class="pupil"/><path d="M43 20q20 2 31-12" class="arm"/><rect x="72" y="-34" width="46" height="64" rx="5" class="panel"/><path d="M81-20h27m-27 12h19m-19 12h24" class="arrow"/></g>
    <g id="refresh"><circle r="48" class="body"/><rect x="-35" y="-23" width="33" height="39" rx="12" class="eye"/><rect x="2" y="-23" width="33" height="39" rx="12" class="eye"/><circle cx="-11" cy="-2" r="6" class="pupil"/><circle cx="11" cy="-2" r="6" class="pupil"/><path d="M-32-58q32-18 64 0m0 0-2-13m2 13-13-1" class="motion"/></g>
    <g id="pointer"><path d="M0 0l15 37 8-13 14 14 8-8-14-14 13-8Z" fill="#F4BE4F" stroke="#181B20" stroke-width="2"/></g>
    <g id="sequence-arrows"><path d="M142 0h78m-9-8 9 8-9 8" class="arrow"/><path d="M310 0h78m-9-8 9 8-9 8" class="arrow"/></g>
  </defs>
  <rect width="1800" height="1260" class="bg"/><rect x="26" y="26" width="1748" height="1208" rx="8" class="paper"/>
  <text x="64" y="84" class="h1">META BOT M1 · INTERACTION MOTION BOARD</text>
  <text x="64" y="120" class="sub">12 组输入序列 · 每组至少三拍 · 表情响应与物理响应同步发生 · 全程无嘴</text>
  <g transform="translate(55 150)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">接近 / Approach</text><text x="508" y="28" class="index">01</text><g transform="translate(78 111)"><use href="#n"/><use href="#pointer" transform="translate(75 -53) scale(.55)"/></g><g transform="translate(246 111)"><use href="#look-r"/><use href="#pointer" transform="translate(62 -39) scale(.55)"/></g><g transform="translate(414 111)"><use href="#curious"/><use href="#pointer" transform="translate(49 -27) scale(.55)"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">detect</text><text x="215" y="194" class="beat">eye catch</text><text x="382" y="194" class="beat">body lean</text><text x="18" y="229" class="meta">radius 96px · 0 → 180ms</text></g>
  <g transform="translate(630 150)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">悬停停留 / Hover</text><text x="508" y="28" class="index">02</text><g transform="translate(78 111)"><use href="#look-r"/></g><g transform="translate(246 111)"><use href="#curious"/></g><g transform="translate(414 111)"><use href="#curious" transform="translate(4 0) scale(1.06)"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">0.2s seen</text><text x="210" y="194" class="beat">0.8s curious</text><text x="375" y="194" class="beat">2.5s approach</text><text x="18" y="229" class="meta">cancel on leave · no loop</text></g>
  <g transform="translate(1205 150)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">按压 / Press</text><text x="508" y="28" class="index">03</text><g transform="translate(78 111)"><use href="#n"/></g><g transform="translate(246 117)"><use href="#press"/><use href="#pointer" transform="translate(35 -56) scale(.55)"/></g><g transform="translate(414 111)"><use href="#press" transform="scale(1.03)"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">down</text><text x="208" y="194" class="beat">squash</text><text x="375" y="194" class="beat">track point</text><text x="18" y="229" class="meta">feedback &lt; 100ms</text></g>

  <g transform="translate(55 420)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">长按锁定 / Hold</text><text x="508" y="28" class="index">04</text><g transform="translate(78 111)"><use href="#press"/></g><g transform="translate(246 111)"><use href="#hold"/></g><g transform="translate(414 111)"><use href="#hold" transform="scale(1.04)"/><path d="M-29-61h58" class="motion"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">press</text><text x="204" y="194" class="beat">square up</text><text x="372" y="194" class="beat">arms brace</text><text x="18" y="229" class="meta">hold threshold 420ms</text></g>
  <g transform="translate(630 420)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">慢速拖拽 / Slow drag</text><text x="508" y="28" class="index">05</text><g transform="translate(78 111)"><use href="#hold"/></g><g transform="translate(246 111)"><use href="#stretch"/></g><g transform="translate(414 111)"><use href="#stretch" transform="translate(5 0)"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">lock</text><text x="205" y="194" class="beat">stretch</text><text x="370" y="194" class="beat">grip direction</text><text x="18" y="229" class="meta">velocity 0–360 px/s</text></g>
  <g transform="translate(1205 420)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">高速拖拽 / Fast drag</text><text x="508" y="28" class="index">06</text><g transform="translate(78 111)"><use href="#stretch"/></g><g transform="translate(246 111)"><use href="#lag"/></g><g transform="translate(414 111)"><use href="#lag" transform="rotate(4)"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">accelerate</text><text x="202" y="194" class="beat">pupil lag</text><text x="374" y="194" class="beat">arms trail</text><text x="18" y="229" class="meta">velocity &gt; 720 px/s</text></g>

  <g transform="translate(55 690)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">急转 / Sharp turn</text><text x="508" y="28" class="index">07</text><g transform="translate(78 111)"><use href="#lag"/></g><g transform="translate(246 111)"><use href="#turn"/></g><g transform="translate(414 111)"><use href="#hold"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">vector A</text><text x="205" y="194" class="beat">eye split</text><text x="372" y="194" class="beat">stabilize</text><text x="18" y="229" class="meta">direction delta &gt; 95°</text></g>
  <g transform="translate(630 690)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">画圈 / Orbit</text><text x="508" y="28" class="index">08</text><g transform="translate(78 111)"><use href="#look-r"/></g><g transform="translate(246 111)"><use href="#turn" transform="rotate(12)"/><path d="M-60 22q-18-42 21-69" class="motion"/></g><g transform="translate(414 111)"><use href="#dizzy"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">follow</text><text x="202" y="194" class="beat">orbit body</text><text x="370" y="194" class="beat">brief dizzy</text><text x="18" y="229" class="meta">cooldown 12s · max 420ms</text></g>
  <g transform="translate(1205 690)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">碰边 / Edge impact</text><text x="508" y="28" class="index">09</text><g transform="translate(78 111)"><use href="#stretch"/></g><g transform="translate(246 111)"><use href="#impact-r"/><path d="M72-55v110" class="arrow"/></g><g transform="translate(414 111)"><use href="#turn"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">approach</text><text x="202" y="194" class="beat">local flatten</text><text x="375" y="194" class="beat">rebound</text><text x="18" y="229" class="meta">anchor remains screen-fixed</text></g>

  <g transform="translate(55 960)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">释放落地 / Release</text><text x="508" y="28" class="index">10</text><g transform="translate(78 111)"><use href="#lag"/></g><g transform="translate(246 119)"><use href="#squash"/></g><g transform="translate(414 111)"><use href="#n"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">release</text><text x="206" y="194" class="beat">land</text><text x="376" y="194" class="beat">settle</text><text x="18" y="229" class="meta">180–340ms by release velocity</text></g>
  <g transform="translate(630 960)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">打开面板 / Open panel</text><text x="508" y="28" class="index">11</text><g transform="translate(78 111)"><use href="#look-r"/></g><g transform="translate(236 111)"><use href="#panel-bot" transform="scale(.9)"/></g><g transform="translate(404 111)"><use href="#panel-bot" transform="scale(.9)"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">anticipate</text><text x="202" y="194" class="beat">push open</text><text x="372" y="194" class="beat">present</text><text x="18" y="229" class="meta">gesture points toward actual panel</text></g>
  <g transform="translate(1205 960)"><rect width="540" height="250" rx="8" class="card"/><text x="18" y="30" class="name">刷新恢复 / Refresh</text><text x="508" y="28" class="index">12</text><g transform="translate(78 111)"><use href="#cautious"/></g><g transform="translate(246 111)"><use href="#refresh"/></g><g transform="translate(414 111)"><use href="#n"/></g><use href="#sequence-arrows" transform="translate(0 111)"/><text x="42" y="194" class="beat">signal slow</text><text x="202" y="194" class="beat">scan/relink</text><text x="374" y="194" class="beat">resume state</text><text x="18" y="229" class="meta">keep behavior timer on quick success</text></g>
</svg>
