<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Meta Bot M1 shape motion board</title>
  <desc id="desc">Eight mouthless body deformation sequences with a green unoutlined silhouette and screen-fixed status anchors.</desc>
  <defs>
    <style>
      .bg{fill:#E8EEE9}.paper{fill:#F8FAF7}.card{fill:#EEF3EF;stroke:#D5DDD7;stroke-width:2}.body{fill:#02AD45}.eye{fill:#F3F6F2}.pupil{fill:#181B20}.arm{fill:none;stroke:#181B20;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:#A7B1AA;stroke-width:2;stroke-dasharray:5 5}.motion{fill:none;stroke:#02AD45;stroke-width:3;stroke-linecap:round}.h1{font:760 42px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#181B20}.sub{font:400 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#5F6B63}.name{font:700 20px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#181B20}.meta{font:500 14px Consolas,'Microsoft YaHei',sans-serif;fill:#66726A}.beat{font:650 12px Consolas,monospace;fill:#7B877F}.index{font:750 14px Consolas,monospace;fill:#02AD45}
    </style>
    <g id="anchors"><circle cx="46" cy="-44" r="7" fill="#F3F6F2" stroke="#181B20" stroke-width="2"/><rect x="38" y="34" width="17" height="14" rx="4" fill="#181B20"/></g>
    <g id="circle"><circle r="52" class="body"/><ellipse cx="-18" cy="-6" rx="18" ry="22" class="eye"/><ellipse cx="18" cy="-6" rx="18" ry="22" class="eye"/><circle cx="-14" cy="-3" r="7" class="pupil"/><circle cx="14" cy="-3" r="7" class="pupil"/></g>
    <g id="breathe"><ellipse rx="54" ry="50" class="body"/><ellipse cx="-19" cy="-6" rx="19" ry="22" class="eye"/><ellipse cx="19" cy="-6" rx="19" ry="22" class="eye"/><circle cx="-15" cy="-3" r="7" class="pupil"/><circle cx="15" cy="-3" r="7" class="pupil"/></g>
    <g id="focus"><ellipse rx="59" ry="46" class="body"/><rect x="-39" y="-27" width="38" height="41" rx="13" class="eye"/><rect x="1" y="-27" width="38" height="41" rx="13" class="eye"/><ellipse cx="-11" cy="-5" rx="6" ry="11" class="pupil"/><ellipse cx="11" cy="-5" rx="6" ry="11" class="pupil"/></g>
    <g id="square"><rect x="-51" y="-51" width="102" height="102" rx="19" class="body"/><rect x="-38" y="-23" width="37" height="38" rx="10" class="eye"/><rect x="1" y="-23" width="37" height="38" rx="10" class="eye"/><ellipse cx="-12" cy="-3" rx="5" ry="9" class="pupil"/><ellipse cx="12" cy="-3" rx="5" ry="9" class="pupil"/><path d="M-47 22q-17 3-17 22m111-22q17 3 17 22" class="arm"/></g>
    <g id="tall"><ellipse rx="42" ry="61" class="body"/><circle cx="-15" cy="-11" r="20" class="eye"/><circle cx="20" cy="-11" r="20" class="eye"/><circle cx="-15" cy="-11" r="6" class="pupil"/><circle cx="20" cy="-11" r="6" class="pupil"/></g>
    <g id="flat"><ellipse rx="61" ry="39" cy="9" class="body"/><path d="M-42-5q21-15 42 0q-5 19-22 20q-17-1-20-20Z" class="eye"/><path d="M0-5q21-15 42 0q-3 19-20 20q-17-1-22-20Z" class="eye"/><ellipse cx="-21" cy="4" rx="7" ry="5" class="pupil"/><ellipse cx="21" cy="4" rx="7" ry="5" class="pupil"/></g>
    <g id="lean"><path d="M-53 4Q-48-45-8-53Q43-52 54-6Q60 40 15 52Q-39 55-53 4Z" class="body"/><ellipse cx="-17" cy="-9" rx="20" ry="23" class="eye" transform="rotate(-10)"/><ellipse cx="20" cy="-4" rx="16" ry="20" class="eye"/><circle cx="-8" cy="-4" r="7" class="pupil"/><circle cx="27" cy="0" r="6" class="pupil"/></g>
    <g id="impact"><path d="M-53 0Q-48-49 0-52Q45-48 50-15V16Q43 48 0 52Q-48 48-53 0Z" class="body"/><ellipse cx="-18" cy="-6" rx="19" ry="21" class="eye"/><rect x="1" y="-27" width="35" height="42" rx="9" class="eye"/><circle cx="-11" cy="-3" r="7" class="pupil"/><circle cx="27" cy="-3" r="7" class="pupil"/><path d="M47 19q18 0 23-17" class="arm"/></g>
    <g id="rebound"><path d="M-50 5Q-45-49 5-51Q52-43 52 5Q45 51-3 52Q-48 46-50 5Z" class="body"/><ellipse cx="-17" cy="-6" rx="18" ry="21" class="eye"/><ellipse cx="19" cy="-6" rx="18" ry="21" class="eye"/><circle cx="-20" cy="-3" r="7" class="pupil"/><circle cx="16" cy="-3" r="7" class="pupil"/></g>
    <g id="flow"><path d="M132 0h72m-9-8 9 8-9 8" class="guide"/><path d="M276 0h72m-9-8 9 8-9 8" class="guide"/></g>
    <g id="anchor-row"><g transform="translate(70 150)"><use href="#anchors" transform="scale(.85)"/></g><g transform="translate(202 150)"><use href="#anchors" transform="scale(.85)"/></g><g transform="translate(334 150)"><use href="#anchors" transform="scale(.85)"/></g></g>
  </defs>
  <rect width="1800" height="1160" class="bg"/><rect x="26" y="26" width="1748" height="1108" rx="8" class="paper"/>
  <text x="64" y="84" class="h1">META BOT M1 · ELASTIC SHAPE LANGUAGE</text>
  <text x="64" y="120" class="sub">默认圆形 · 纯色无描边 · 形变近似面积守恒 · 右上状态锚和右下任务锚不参与身体变形</text>

  <g transform="translate(55 150)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">呼吸 / Rest pulse</text><text x="372" y="30" class="index">01</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 150)"><use href="#circle" transform="scale(.78)"/></g><g transform="translate(202 150)"><use href="#breathe" transform="scale(.82)"/></g><g transform="translate(334 150)"><use href="#circle" transform="scale(.78)"/></g><use href="#flow" transform="translate(0 150)"/><text x="47" y="276" class="beat">100%</text><text x="179" y="276" class="beat">103%</text><text x="311" y="276" class="beat">100%</text><text x="18" y="322" class="meta">idle · 2.8–4.2s · ±3%</text><text x="18" y="352" class="meta">eyes counter-scale to remain crisp</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">silhouette: circle → soft oval → circle</text></g>
  <g transform="translate(485 150)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">专注收束 / Focus</text><text x="372" y="30" class="index">02</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 150)"><use href="#circle" transform="scale(.78)"/></g><g transform="translate(202 150)"><use href="#focus" transform="scale(.78)"/></g><g transform="translate(334 150)"><use href="#focus" transform="scale(.8)"/></g><use href="#flow" transform="translate(0 150)"/><text x="46" y="276" class="beat">idle</text><text x="177" y="276" class="beat">widen</text><text x="307" y="276" class="beat">lock</text><text x="18" y="322" class="meta">working · 260ms enter</text><text x="18" y="352" class="meta">horizontal body, inward pupils</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">silhouette: circle → focus oval</text></g>
  <g transform="translate(915 150)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">长按紧张 / Hold tense</text><text x="372" y="30" class="index">03</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 150)"><use href="#circle" transform="scale(.78)"/></g><g transform="translate(202 150)"><use href="#square" transform="scale(.75)"/></g><g transform="translate(334 150)"><use href="#square" transform="scale(.79)"/></g><use href="#flow" transform="translate(0 150)"/><text x="43" y="276" class="beat">press</text><text x="174" y="276" class="beat">corners</text><text x="304" y="276" class="beat">brace</text><text x="18" y="322" class="meta">hold &gt; 420ms</text><text x="18" y="352" class="meta">arms brace only after lock</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">silhouette: circle → rounded square</text></g>
  <g transform="translate(1345 150)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">突然惊讶 / Surprise</text><text x="372" y="30" class="index">04</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 150)"><use href="#circle" transform="scale(.78)"/></g><g transform="translate(202 150)"><use href="#tall" transform="scale(.78)"/></g><g transform="translate(334 150)"><use href="#circle" transform="scale(.78)"/></g><use href="#flow" transform="translate(0 150)"/><text x="43" y="276" class="beat">event</text><text x="177" y="276" class="beat">stretch</text><text x="307" y="276" class="beat">settle</text><text x="18" y="322" class="meta">120ms rise · 280ms settle</text><text x="18" y="352" class="meta">large eyes, small pupils</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">silhouette: circle → vertical capsule</text></g>

  <g transform="translate(55 625)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">长时疲惫 / Fatigue</text><text x="372" y="30" class="index">05</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 150)"><use href="#circle" transform="scale(.78)"/></g><g transform="translate(202 157)"><use href="#flat" transform="scale(.78)"/></g><g transform="translate(334 157)"><use href="#flat" transform="scale(.81)"/></g><use href="#flow" transform="translate(0 150)"/><text x="42" y="276" class="beat">run</text><text x="175" y="276" class="beat">sink</text><text x="306" y="276" class="beat">reset</text><text x="18" y="322" class="meta">long task · never signal failure</text><text x="18" y="352" class="meta">slow y-settle, low lids</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">silhouette: circle → bottom-heavy oval</text></g>
  <g transform="translate(485 625)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">靠近好奇 / Curious lean</text><text x="372" y="30" class="index">06</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 150)"><use href="#circle" transform="scale(.78)"/></g><g transform="translate(202 150)"><use href="#lean" transform="scale(.78)"/></g><g transform="translate(334 150)"><use href="#lean" transform="translate(4 0) scale(.8)"/></g><use href="#flow" transform="translate(0 150)"/><text x="42" y="276" class="beat">sense</text><text x="176" y="276" class="beat">lean</text><text x="305" y="276" class="beat">peek</text><text x="18" y="322" class="meta">pointer inside 96px radius</text><text x="18" y="352" class="meta">near eye reacts 60ms earlier</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">silhouette: circle → asymmetric soft body</text></g>
  <g transform="translate(915 625)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">碰边回弹 / Edge impact</text><text x="372" y="30" class="index">07</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 150)"><use href="#focus" transform="scale(.78)"/></g><g transform="translate(202 150)"><use href="#impact" transform="scale(.78)"/><path d="M48-55v110" class="guide"/></g><g transform="translate(334 150)"><use href="#rebound" transform="scale(.78)"/></g><use href="#flow" transform="translate(0 150)"/><text x="40" y="276" class="beat">travel</text><text x="171" y="276" class="beat">flatten</text><text x="301" y="276" class="beat">rebound</text><text x="18" y="322" class="meta">local deformation at contact side</text><text x="18" y="352" class="meta">do not scale entire component</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">anchors remain at fixed screen coordinates</text></g>
  <g transform="translate(1345 625)"><rect width="405" height="450" rx="8" class="card"/><text x="18" y="32" class="name">释放恢复 / Release settle</text><text x="372" y="30" class="index">08</text><rect x="35" y="66" width="335" height="178" rx="6" class="guide"/><g transform="translate(70 142)"><use href="#tall" transform="scale(.72)"/></g><g transform="translate(202 157)"><use href="#flat" transform="scale(.82)"/></g><g transform="translate(334 150)"><use href="#circle" transform="scale(.78)"/></g><use href="#flow" transform="translate(0 150)"/><text x="42" y="276" class="beat">drop</text><text x="174" y="276" class="beat">squash</text><text x="306" y="276" class="beat">rest</text><text x="18" y="322" class="meta">velocity-driven 180–340ms</text><text x="18" y="352" class="meta">one overshoot, then settle</text><path d="M20 390h365" class="guide"/><text x="18" y="422" class="meta">silhouette: tall → flat → circle</text></g>
  <g aria-label="Screen-fixed status and task anchors">
    <use href="#anchor-row" transform="translate(55 150)"/><use href="#anchor-row" transform="translate(485 150)"/><use href="#anchor-row" transform="translate(915 150)"/><use href="#anchor-row" transform="translate(1345 150)"/>
    <use href="#anchor-row" transform="translate(55 625)"/><use href="#anchor-row" transform="translate(485 625)"/><use href="#anchor-row" transform="translate(915 625)"/><use href="#anchor-row" transform="translate(1345 625)"/>
  </g>
</svg>
