<h1>鼠标互动 · 10 类 / 30 套回应</h1>
<p>逐套预览只运行一个机器人。切换到“试试鼠标”后，在头顶缓慢来回抚摸、两侧快速挠动、身体下方左右移动、周围绕圈，或停在手边等它邀请击掌。按住机器人可以拖动。</p>
<div class="controls"><select id="clip" aria-label="动作"></select><button id="previous">上一套</button><button id="next">下一套</button><button id="replay">重播</button><button id="live">试试鼠标</button></div>
